[pytest]
testpaths = tests
python_files = test_*.py
addopts =
    -ra
    -m "not live"
    --strict-markers
    --cov=app
    --cov-report=term-missing:skip-covered
    --cov-report=html:htmlcov
    --cov-report=xml:coverage.xml
    --cov-fail-under=70
markers =
    live: тесты против настоящего AIESEC