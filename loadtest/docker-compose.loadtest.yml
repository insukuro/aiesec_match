name: aiesec-loadtest

services:
  prometheus:
    image: prom/prometheus:v2.55.1
    command:
      - --config.file=/etc/prometheus/prometheus.yml
      - --storage.tsdb.path=/prometheus
      - --web.enable-remote-write-receiver
      - --enable-feature=native-histograms
    volumes:
      - ./prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://localhost:9090/-/ready"]
      interval: 5s
      timeout: 3s
      retries: 12
    networks: [monitoring]

  grafana:
    image: grafana/grafana:11.3.0
    environment:
      GF_AUTH_ANONYMOUS_ENABLED: "true"
      GF_AUTH_ANONYMOUS_ORG_ROLE: Viewer
      GF_USERS_ALLOW_SIGN_UP: "false"
    depends_on:
      prometheus:
        condition: service_healthy
    ports:
      - "127.0.0.1:3000:3000"
    volumes:
      - ./grafana/provisioning:/etc/grafana/provisioning:ro
      - ./grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    networks: [monitoring]

  docker-metrics:
    image: python:3.12-slim
    profiles: [resources]
    restart: unless-stopped
    command: ["python", "/app/docker_metrics.py"]
    environment:
      DOCKER_PROJECT: aiesec-match
    volumes:
      - ./scripts/docker_metrics.py:/app/docker_metrics.py:ro
      - /var/run/docker.sock:/var/run/docker.sock:ro
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8080/metrics', timeout=4).read()"]
      interval: 5s
      timeout: 5s
      retries: 6
    networks: [monitoring]

  k6:
    image: grafana/k6:0.54.0
    profiles: [loadtest]
    environment:
      BACKEND_URL: http://backend:8000
      K6_PROMETHEUS_RW_SERVER_URL: http://prometheus:9090/api/v1/write
      K6_PROMETHEUS_RW_TREND_AS_NATIVE_HISTOGRAM: "true"
      K6_PROMETHEUS_RW_PUSH_INTERVAL: 5s
    volumes:
      - ./k6:/scripts:ro
      - ${RUN_DIR:-./results}:/results
    networks: [monitoring, aiesec]

networks:
  monitoring:
  aiesec:
    name: aiesec-backend
    external: true

volumes:
  prometheus-data:
  grafana-data:
