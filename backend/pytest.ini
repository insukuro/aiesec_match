[pytest]
asyncio_mode = auto
testpaths = tests
pythonpath = .
addopts =
    -ra
    --strict-markers
    --strict-config
    --cov=app
    --cov-report=term-missing:skip-covered
    --cov-report=html:htmlcov
    --cov-report=xml:coverage.xml
    --cov-fail-under=50
markers =
    integration: требует реальной БД/сети
    slow: длинные тесты