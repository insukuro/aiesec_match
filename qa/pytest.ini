[pytest]
testpaths = .
python_files = test_*.py
addopts = --strict-markers -p no:cacheprovider
markers =
    smoke: дымовой уровень, все сервисы живы
    critical: критический путь пользователя от регистрации до подбора
    extended: границы, негативные случаи, права в БД
    bug: тест воспроизводит открытый дефект (в имени указан номер баг-репорта)
