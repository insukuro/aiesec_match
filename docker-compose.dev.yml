services:
  postgres:
    container_name: aiesec-postgres-dev

  db-init:
    container_name: aiesec-db-init-dev

  parser:
    build:
      context: .
      dockerfile: infra/docker/parser.dev.Dockerfile
    image: aiesec-parser:dev
    container_name: aiesec-parser-dev
    command: ["uvicorn", "app.main:app", "--host", "0.0.0.0", "--port", "8000", "--reload", "--workers", "1"]
    environment:
      SCHEDULER_ENABLED: "false"
      ALLOW_NO_TOKEN: "true"
    volumes:
      - ./.env:/srv/.env:ro
      - ./parser/app:/srv/app:ro
      - ./parser/targets.json:/srv/targets.json:ro
      - ./parser/tests:/srv/tests:ro
      - ./parser/pytest.ini:/srv/pytest.ini:ro
      - ./parser/alembic.ini:/srv/alembic.ini:ro
      - ./parser/migrations:/srv/migrations:ro

  tests:
    build:
      context: .
      dockerfile: infra/docker/parser.dev.Dockerfile
    image: aiesec-parser:dev
    profiles: ["tools"]
    working_dir: /srv
    environment:
      SCHEDULER_ENABLED: "false"
      ALLOW_NO_TOKEN: "true"
      AIESEC_TOKEN: "test-token"
      DATABASE_URL: sqlite:////tmp/test.db
      DB_SCHEMA: ""
    volumes:
      - ./htmlcov:/srv/htmlcov
      - ./.env:/srv/.env:ro
      - ./parser/app:/srv/app:ro
      - ./parser/tests:/srv/tests:ro
      - ./parser/pytest.ini:/srv/pytest.ini:ro
      - ./parser/targets.json:/srv/targets.json:ro
      - ./parser/.coveragerc:/srv/.coveragerc:ro
    entrypoint: ["python", "-m", "pytest"]
    command: ["-q"]

volumes:
  pgdata:
    name: aiesec-pgdata-dev