# Автоматический прогон тестов (CI). Запускается сам при каждом push в main и при каждом pull request.
# Порядок такой же, как в тест-плане: сначала быстрое и дешёвое, потом медленное.
name: tests

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:        # кнопка «Run workflow» для ручного запуска

jobs:
  matcher:
    name: matcher (unit + API)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: matcher
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
          cache: pip
          cache-dependency-path: infra/requirements/*.txt
      - name: Установить зависимости
        run: pip install -r ../infra/requirements/matcher-dev.txt ruff
      - name: Статический анализ (ruff)
        run: ruff check --isolated --select F,E9 app tests tools
      - name: Smoke (порог 100%)
        run: pytest -q -m smoke
      - name: Критический путь
        run: pytest -q -m critical
      - name: Полный регрессионный набор и покрытие
        run: pytest -q --cov=app --cov-report=term-missing --cov-fail-under=90 --junitxml=report.xml
      - name: Контрольные дефекты (тесты обязаны ловить внесённые ошибки)
        run: python tools/control_defects.py
      - name: Сохранить отчёт
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: matcher-report
          path: matcher/report.xml

  system:
    name: system (весь стек в docker compose)
    runs-on: ubuntu-latest
    needs: matcher            # системные тесты дороже, запускаем только если быстрые зелёные
    # Пока открыты дефекты BUG-I-01..03 и BUG-DB-01, стек из main не поднимается, поэтому эта
    # задача не должна красить весь прогон. Когда дефекты закроют, строку ниже нужно удалить.
    continue-on-error: true
    env:
      COMPOSE: docker compose -f docker-compose.yml -f docker-compose.dev.yml -f docker-compose.qa.yml
      MATCHER_CATALOG_SOURCE: db
      MATCHER_CATALOG_CACHE_TTL_S: "0"
    steps:
      - uses: actions/checkout@v4
      - name: Тестовый .env (настоящих секретов в CI нет)
        run: |
          cp .env.example .env
          echo "POSTGRES_PASSWORD=ci_only_password" >> .env
      - name: Поднять стек
        run: $COMPOSE up -d --build postgres db-init backend parser matcher
      - name: Дождаться matcher
        run: |
          for i in $(seq 1 30); do
            curl -fs http://127.0.0.1:8002/health && exit 0
            sleep 2
          done
          exit 1
      - name: Системные тесты
        run: $COMPOSE --profile tools run --rm qa-tests -q
      - name: Логи сервисов при падении
        if: failure()
        run: $COMPOSE logs --tail=200 backend matcher parser db-init
      - name: Остановить стек
        if: always()
        run: $COMPOSE down
