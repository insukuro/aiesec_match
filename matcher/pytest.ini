[pytest]
testpaths = tests
pythonpath = .
addopts = --strict-markers
markers =
    smoke: дымовой уровень, сервис жив и отвечает на главный запрос
    critical: критический путь, главные сценарии подбора
    extended: расширенный уровень, границы, негативные и редкие случаи
    regression: тесты на найденные и исправленные дефекты (BUG-M-xx)
