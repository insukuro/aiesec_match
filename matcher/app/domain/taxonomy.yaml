# ---- study.status -> constant_id уровня учёбы AIESEC ----
study_levels:
  school:       10782   # High School
  bachelor:     10785   # Bachelor
  master:       10787   # Masters
  # postgraduate / graduate: кодов уровня в каталоге нет.
  # Фильтр Ф5 для них не срабатывает (безопасно, кандидат не отсекается).
  # not_studying: намеренно без кода — фильтр Ф5 не режет.

