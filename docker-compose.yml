name: aiesec-match

services:
  postgres:
    image: postgres:16-alpine
    container_name: aiesec-postgres
    restart: unless-stopped
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-platform}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env}
      POSTGRES_DB: postgres
      APP_DB: ${APP_DB:-aiesec_match}
    volumes:
      - pgdata:/var/lib/postgresql/data
      - ./infra/postgres/init:/docker-entrypoint-initdb.d:ro
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -h 127.0.0.1 -U ${POSTGRES_USER:-platform} -d ${APP_DB:-aiesec_match}"]
      interval: 5s
      timeout: 3s
      retries: 10
    networks: [backend]

  db-init:
    image: postgres:16-alpine
    container_name: aiesec-db-init
    restart: "no"
    depends_on:
      postgres:
        condition: service_healthy
    environment:
      PGHOST: postgres
      PGPORT: "5432"
      PGUSER: ${POSTGRES_USER:-platform}
      PGPASSWORD: ${POSTGRES_PASSWORD:?задайте POSTGRES_PASSWORD в .env}
      APP_DB: ${APP_DB:-aiesec_match}
      BACKEND_DB_PASSWORD: ${BACKEND_DB_PASSWORD:-backend}
      PARSER_DB_PASSWORD: ${PARSER_DB_PASSWORD:-parser}
    volumes:
      - ./infra/postgres:/bootstrap:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - |
        set -e
        psql -v ON_ERROR_STOP=1 \
             -v app_db="$$APP_DB" \
             -v backend_pw="$$BACKEND_DB_PASSWORD" \
             -v parser_pw="$$PARSER_DB_PASSWORD" \
             -v matcher_pw="${MATCHER_DB_PASSWORD:-matcher}" \
             -d postgres -f /bootstrap/bootstrap.sql
    networks: [backend]

  backend:
    build:
      context: .
      dockerfile: infra/docker/backend.Dockerfile
    image: aiesec-backend:local
    container_name: aiesec-backend
    restart: unless-stopped
    depends_on:
      postgres: { condition: service_healthy }
      db-init:  { condition: service_completed_successfully }
    environment:
      AIESEC_DATABASE_URL: postgresql+asyncpg://backend_writer:${BACKEND_DB_PASSWORD:-backend}@postgres:5432/${APP_DB:-aiesec_match}
      AIESEC_JWT_SECRET: ${JWT_SECRET:-change-me}
      AIESEC_TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN:-}
      AIESEC_PROFILE_HMAC_SECRET: ${PROFILE_HMAC_SECRET:-change-me-hmac}
      AIESEC_MATCHER_BASE_URL: http://matcher:8000
    ports:
      - "127.0.0.1:${BACKEND_PORT:-8000}:8000"
    networks: [backend]

  web:
    build:
      context: .
      dockerfile: infra/docker/web.Dockerfile
    image: aiesec-web:local
    container_name: aiesec-web
    restart: unless-stopped
    depends_on:
      backend: { condition: service_healthy }
    ports:
      - "127.0.0.1:${WEB_PORT:-8080}:80"
    networks: [backend]

  parser:
    build:
      context: .
      dockerfile: infra/docker/parser.Dockerfile
    image: aiesec-parser:local
    container_name: aiesec-parser
    restart: unless-stopped
    depends_on:
      postgres:
        condition: service_healthy
      db-init:
        condition: service_completed_successfully
    environment:
      AIESEC_TOKEN: ${AIESEC_TOKEN:-}
      AIESEC_REFRESH_TOKEN: ${AIESEC_REFRESH_TOKEN:-}
      AIESEC_CLIENT_ID: ${AIESEC_CLIENT_ID:-}
      AIESEC_CLIENT_SECRET: ${AIESEC_CLIENT_SECRET:-}
      AIESEC_AUTH_URL: ${AIESEC_AUTH_URL:-https://auth.aiesec.org/oauth/token}
      AIESEC_AUTH_ORIGIN: ${AIESEC_AUTH_ORIGIN:-https://aiesec.org}
      ALLOW_NO_TOKEN: ${PARSER_ALLOW_NO_TOKEN:-false}
      DATABASE_URL: postgresql+psycopg://parser_writer:${PARSER_DB_PASSWORD:-parser}@postgres:5432/${PARSER_DB:-parser}
      DB_SCHEMA: parser
      TARGETS_FILE: /srv/targets.json
      REQUEST_DELAY_SEC: ${PARSER_REQUEST_DELAY_SEC:-0.7}
      INCREMENTAL_INTERVAL_MINUTES: ${PARSER_INCREMENTAL_INTERVAL_MINUTES:-360}
      RECONCILE_INTERVAL_HOURS: ${PARSER_RECONCILE_INTERVAL_HOURS:-24}
      INCREMENTAL_DATE_FILTER: ${PARSER_INCREMENTAL_DATE_FILTER:-created}
      SCHEDULER_ENABLED: ${PARSER_SCHEDULER_ENABLED:-true}
    volumes:
      - ./parser/targets.json:/srv/targets.json:ro
    ports:
      - "127.0.0.1:${PARSER_PORT:-8001}:8000"
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/health', timeout=3).status == 200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5
      start_period: 20s
    networks: [backend]
    
    
  matcher:
    build:
      context: .
      dockerfile: infra/docker/matcher.Dockerfile
    image: aiesec-matcher
    container_name: aiesec-matcher
    restart: unless-stopped
    environment:
      MATCHER_CATALOG_SOURCE: ${MATCHER_CATALOG_SOURCE:-fake}
      MATCHER_DATABASE_URL: postgresql+psycopg://matcher_writer:${MATCHER_DB_PASSWORD:-matcher}@postgres:5432/${APP_DB:-aiesec_match}    
    depends_on:
      postgres:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 5s
      retries: 5
    networks:
      - backend


volumes:
  pgdata:
    name: aiesec-pgdata

networks:
  backend:
    name: aiesec-backend